<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f6">
  <title>Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="workspace.css">
  <script src="workspace.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="workspace-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">'_'</span><span>Just workspace<span class="brand-period">.</span></span></div>
      <a class="home-link" href="index.html">← Back to home</a>
    </header>

    <section class="intro" aria-labelledby="workspace-title">
      <p class="eyebrow" id="today-date"></p>
      <!-- <h1 id="workspace-title">Make room for <em>focus.</em></h1> -->
      <!-- <p class="wd">A little corner to get little things done.</p> -->
    </section>

    <div class="workspace-content">
      <section class="panel task-panel" aria-labelledby="tasks-title">
        <div class="panel-heading"><div><p class="section-kicker"></p><h2 id="tasks-title">Today's tasks</h2></div><span class="counter" id="task-count">0 left</span></div>
        <form class="task-input" id="task-form">
          <label class="sr-only" for="task-input">New task</label>
          <input id="task-input" type="text" placeholder="What needs to get done?" maxlength="160" autocomplete="off" required>
          <button id="add-task-btn" type="submit" aria-label="Add task">+</button>
        </form>
        <div class="task-toolbar"><span id="task-progress"></span><button class="text-button" id="clear-completed" type="button">Clear done</button></div>
        <ul id="task-list" aria-label="Tasks"></ul>
        <p class="empty-state" id="tasks-empty">Start with a small task :></p>
      </section>

      <section class="panel focus-timer" aria-labelledby="timer-title">
        <div class="panel-heading"><div><p class="section-kicker"></p><h2 id="timer-title">Timer</h2></div><span class="status-dot" id="timer-status">Ready</span></div>
        <div class="mode-selector" role="group" aria-label="Timer duration">
          <button type="button" class="mode active" data-minutes="25" aria-pressed="true">Focus · 25m</button>
          <button type="button" class="mode" data-minutes="5" aria-pressed="false">Break · 5m</button>
          <button type="button" class="mode" data-minutes="15" aria-pressed="false">Long break · 15m</button>
        </div>
        <div class="timer-circle" id="timer-circle" style="--progress: 0%">
          <div class="timer-face"><span class="timer-label">TIME REMAINING</span><div id="timer-display" role="timer" aria-live="off">25:00</div><span class="timer-caption" id="timer-caption"></span></div>
        </div>
        <div class="timer-actions"><button id="start-timer" class="primary-button" type="button">Start focus</button><button id="stop-timer" class="secondary-button" type="button" disabled>Pause</button><button id="reset-timer" class="icon-button" type="button" aria-label="Reset timer" title="Reset timer">↺</button></div>
      </section>

      <section class="panel brain-dump" aria-labelledby="brain-title">
        <div class="panel-heading"><div><p class="section-kicker"></p><h2 id="brain-title">Brain dump</h2></div><span class="save-indicator" id="save-status"></span></div>
        <label class="sr-only" for="brain-dump-input">Notes</label>
        <textarea id="brain-dump-input" placeholder="Thoughts, ideas, reminders, anything on your mind..." spellcheck="true"></textarea>
        <div class="notes-footer"><span></span><button class="text-button" id="clear-notes" type="button">Clear notes</button></div>
      </section>
    </div>
    <footer class="workspace-footer"> <span></span></footer>
  </main>
</body>
</html>
